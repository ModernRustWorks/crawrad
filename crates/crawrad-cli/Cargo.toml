[package]
name = "crawrad-cli"
version = "0.1.0"
description = "The crawrad command line: component manifests and note validation without compiling"
edition.workspace = true
license.workspace = true
publish = false
authors.workspace = true

[[bin]]
name = "crawrad"
path = "src/main.rs"

# Eight dependencies, and none of them is the IDE.
#
# `crawrad-manifest-gen` reads the component struct; `crawrad-component` assembles
# the manifest; `crawrad-note-format` parses note markdown; `syn` inspects Rust
# source without compiling; `toml` reads the package Cargo.toml.
# `proc-macro2` and `quote` turn the item into tokens for the signature check.
# `serde_json` parses cargo doc json diagnostics.
[dependencies]
crawrad-note = { workspace = true }
# `span-locations`: the anchor's line comes from its span, not a text search.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
crawrad-component.workspace = true
crawrad-manifest-gen.workspace = true
crawrad-note-format = { workspace = true, features = ["syn"] }
serde_json.workspace = true
syn = { version = "2.0", features = ["full", "visit"] }
toml = "1.1"

[lints]
workspace = true
