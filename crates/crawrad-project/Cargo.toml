[package]
name = "crawrad-project"
version = "0.1.0"
description = "Project model, workspace inspection, template generator, and package installer for CrawRAD"
edition.workspace = true
license.workspace = true
publish = false
authors.workspace = true

[dependencies]
crawrad-note = { workspace = true }
crawrad-settings = { workspace = true }
crawrad-runtime = { workspace = true }
crawrad-actions.workspace = true
crawrad-codegen.workspace = true
crawrad-component.workspace = true
crawrad-doc.workspace = true
crawrad-ir.workspace = true
crawrad-manifest-gen.workspace = true
crawrad-note-format.workspace = true
crawrad-os.workspace = true
crawrad-package.workspace = true
crawrad-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
png.workspace = true
object.workspace = true
rustc-demangle.workspace = true
# Synchronous HTTP client to query the crates.io REST API. The pure-Rust
# cryptographic provider keeps the cross-compilation gate for all three
# platforms without requiring a C compiler for `ring`.
ureq.workspace = true
rustls-graviola.workspace = true

[lints]
workspace = true

[dev-dependencies]
crawrad-registry = { workspace = true, features = ["test-support"] }
# The Release report tests write small ELF / Mach-O objects to read back (#933).
object = { workspace = true, features = ["write"] }
