[package]
name = "crawrad-note"
version = "0.1.0"
description = "Turns CrawRAD IDE notes into rustdoc: #[note(\"id\")] reads .crawrad/notes/<id>.md"
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository = "https://github.com/ModernRustWorks/crawrad"
keywords = ["rustdoc", "documentation", "notes", "ide"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
crawrad-note-format = { workspace = true, features = ["syn"] }
syn = { version = "2.0", features = ["full"] }

[lints]
workspace = true
